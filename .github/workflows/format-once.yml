name: One-shot formatter (temporary)
on:
  push:
    branches: [feat/foundation]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Format and regenerate exact reference output
        run: |
          ruff check --fix . || true
          ruff format .
          python scripts/make_reference_values.py > docs/spec/reference_values.md
          ruff check . || true
          git diff --stat
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: format tasks 9-12 and generate reference values"
            git push origin HEAD:feat/foundation
          fi
