name: Temporary task13 formatter
on:
  push:
    branches: [feat/cashflow]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cashflow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Apply Ruff without weakening checks
        run: |
          ruff format .
          ruff check --fix .
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Ruff format and safe lint fixes"
            git push origin HEAD:feat/cashflow
          fi
