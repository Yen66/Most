name: CI
on:
  pull_request:
  push:
    branches: [main, feat/foundation]
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q -m 'not postgres'
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: construction_os
          POSTGRES_USER: construction_os
          POSTGRES_PASSWORD: construction_os
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U construction_os -d construction_os"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://construction_os:construction_os@localhost:5432/construction_os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: pytest -q
