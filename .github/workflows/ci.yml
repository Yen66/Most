name: CI
on:
  pull_request:
  push:
    branches: [main, feat/foundation]
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff format .
      - run: ruff check --fix . || true
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-tree
          path: |
            src
            tests
            scripts
            migrations
            pyproject.toml
