[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "construction-os"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["SQLAlchemy==2.0.50","alembic==1.18.4","psycopg[binary]==3.2.10","openpyxl==3.1.5"]

[project.optional-dependencies]
dev = ["pytest==9.0.2","ruff==0.13.2"]

[project.scripts]
construction-os = "construction_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["postgres: tests requiring PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 140
[tool.ruff.lint]
select = ["F","E9"]
